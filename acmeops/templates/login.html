{% extends "base.html" %}
{% block content %}
<h1>Vendor Portal sign in</h1>
{% if message %}<p class="notice" id="login-message">{{ message }}</p>{% endif %}
<form method="post" action="/portal/login" class="stack" id="login-form">
  {% if variant == 'b' %}
  <div class="field"><label for="pw">Password</label><input id="pw" type="password" name="password" required></div>
  <div class="field"><label for="em">Work email</label><input id="em" type="email" name="email" required></div>
  <button type="submit" class="primary">Continue</button>
  {% else %}
  <div class="field"><label for="em">Email address</label><input id="em" type="email" name="email" required></div>
  <div class="field"><label for="pw">Password</label><input id="pw" type="password" name="password" required></div>
  <button type="submit" class="primary">Sign in</button>
  {% endif %}
</form>
{% endblock %}
